name: Hourly Streak Report

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hourly-streak-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch profile contribution graph and streak status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: Higer23
          GH_REPO: snapchat
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os, re, json, datetime, urllib.request, urllib.error
          from html import unescape

          owner = os.environ["GH_OWNER"]
          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          today = datetime.datetime.now(datetime.timezone.utc).date()
          year_start = today.replace(month=1, day=1)

          # Public profile contribution graph. Correct regex boundaries are important here.
          url = f"https://github.com/users/{owner}/contributions?from={year_start.isoformat()}&to={today.isoformat()}"
          req = urllib.request.Request(url, headers={"User-Agent": "Higer23-Streak-Reporter/1.0"})
          with urllib.request.urlopen(req, timeout=20) as response:
              svg = response.read().decode("utf-8", "replace")

          daily = {}
          for tag in re.findall(r"<rect\b[^>]*>", svg):
              date_match = re.search(r'data-date="(\d{4}-\d{2}-\d{2})"', tag)
              count_match = re.search(r'data-count="(\d+)"', tag)
              if date_match and count_match:
                  daily[date_match.group(1)] = int(count_match.group(1))
          if not daily:
              # GitHub may expose the day count as aria-label instead of data-count.
              for tag in re.findall(r"<rect\b[^>]*>", svg):
                  date_match = re.search(r'data-date="(\d{4}-\d{2}-\d{2})"', tag)
                  label_match = re.search(r'aria-label="([^"]+)"', tag)
                  if date_match and label_match:
                      n = re.search(r"(\d+)", unescape(label_match.group(1)))
                      daily[date_match.group(1)] = int(n.group(1)) if n else 0
          if not daily:
              raise RuntimeError("Could not parse public GitHub contribution graph. No report sent rather than inventing statistics.")

          annual_total = sum(daily.values())
          today_count = daily.get(today.isoformat(), 0)
          streak = 0
          cursor = today if today_count > 0 else today - datetime.timedelta(days=1)
          while cursor.isoformat() in daily and daily.get(cursor.isoformat(), 0) > 0:
              streak += 1
              cursor -= datetime.timedelta(days=1)

          api = f"https://api.github.com/repos/{owner}/{repo}/actions/workflows/streak-keeper.yml/runs?per_page=20"
          api_req = urllib.request.Request(api, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Higer23-Streak-Reporter/1.0"
          })
          with urllib.request.urlopen(api_req, timeout=20) as response:
              runs = json.load(response).get("workflow_runs", [])
          today_runs = [r for r in runs if r.get("created_at", "").startswith(today.isoformat())]
          successful_today = any(r.get("conclusion") == "success" for r in today_runs)
          failed_today = any(r.get("conclusion") == "failure" for r in today_runs)
          if successful_today:
              status, status_color = "🟢 BAŞARILI", 0x2ECC71
          elif failed_today:
              status, status_color = "🔴 BAŞARISIZ", 0xE74C3C
          else:
              status, status_color = "🟡 HENÜZ DOĞRULANAMADI", 0xF1C40F

          payload = {
            "username": "Higer Streak Monitor",
            "allowed_mentions": {"parse": []},
            "embeds": [{
              "title": "💚 HIGER · SAATLİK STREAK RAPORU",
              "url": f"https://github.com/{owner}",
              "color": status_color,
              "fields": [
                {"name": "📍 Bugünkü Streak Keeper", "value": status, "inline": True},
                {"name": "🔥 Mevcut Ardışık Gün", "value": f"**{streak} gün**", "inline": True},
                {"name": f"📅 {today.year} Yılı Katkıları", "value": f"**{annual_total:,}**", "inline": True},
                {"name": "⚡ Bugünkü Katkılar (UTC)", "value": f"**{today_count:,}**", "inline": True},
                {"name": "🧾 Sayım Açıklaması", "value": "GitHub profil katkı grafiğindeki katkılar; yalnızca commit sayısı değildir.", "inline": False},
                {"name": "🔗 Streak Keeper Çalışmaları", "value": f"[GitHub Actions kayıtlarını aç](https://github.com/{owner}/{repo}/actions/workflows/streak-keeper.yml)", "inline": False}
              ],
              "footer": {"text": "Saatlik otomatik rapor · GitHub profil verileri · Saatler UTC"},
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat()
            }]
          }
          if not webhook:
              raise RuntimeError("DISCORD_WEBHOOK_URL secret is missing.")
          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(webhook, data=body, headers={"Content-Type": "application/json", "User-Agent": "Higer23-Streak-Reporter/1.0"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              raise RuntimeError(f"Discord webhook returned HTTP {exc.code}; check the secret and webhook permissions.") from exc
          print(f"Discord report sent. profile_contributions_year={annual_total}, today={today_count}, streak={streak}, keeper={status}")
          PY
