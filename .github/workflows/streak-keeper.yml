name: Streak Keeper

on:
  schedule:
    # Three daily checks at off-the-hour UTC times to reduce scheduler contention.
    - cron: '17 5 * * *'
    - cron: '23 11 * * *'
    - cron: '37 17 * * *'
  workflow_dispatch:
    inputs:
      force_commit:
        description: 'Force one heartbeat commit today (normally leave false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: streak-keeper-main
  cancel-in-progress: false

env:
  TZ: Europe/Berlin
  GH_TOKEN: ${{ github.token }}

jobs:
  keeper:
    name: Check and protect daily contribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure verified GitHub identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Higer23"
          git config user.email "208321685+Higer23@users.noreply.github.com"
          echo "Berlin local time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Check whether today's heartbeat already exists
        id: check
        shell: bash
        env:
          FORCE_COMMIT: ${{ inputs.force_commit || 'false' }}
        run: |
          set -euo pipefail
          TODAY="$(date +%F)"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_COMMIT" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Manual force requested; a heartbeat commit will be created."
            exit 0
          fi

          LAST_DATE=""
          if [ -f .github/streak-keeper/heartbeat.json ]; then
            LAST_DATE="$(python3 -c 'import json; print(json.load(open(".github/streak-keeper/heartbeat.json")).get("date", ""))' 2>/dev/null || true)"
          fi

          if [ "$LAST_DATE" = "$TODAY" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Today's heartbeat already exists ($TODAY); no duplicate commit."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "No heartbeat for $TODAY; a commit is needed."
          fi

      - name: Create one durable daily heartbeat
        id: heartbeat
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/streak-keeper
          python3 - <<'PY'
          import json, datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          local = datetime.datetime.now().astimezone()
          payload = {
              "date": local.strftime("%Y-%m-%d"),
              "timezone": "Europe/Berlin",
              "created_at_utc": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "purpose": "Daily GitHub Actions heartbeat; one commit per Berlin calendar day."
          }
          with open(".github/streak-keeper/heartbeat.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
          git add .github/streak-keeper/heartbeat.json
          git commit -m "chore(streak): heartbeat ${{ steps.check.outputs.today }}"

          PUSHED=false
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              git fetch origin main
              git rebase origin/main
              sleep $((attempt * 4))
            fi
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::Unable to push the daily heartbeat after three attempts."
            exit 1
          fi

          # A successful rebase changes the commit SHA, so capture HEAD after retries.
          COMMIT_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error::Push returned success but the heartbeat commit was not found in origin/main history."
            exit 1
          fi

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_url=https://github.com/${{ github.repository }}/commit/$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "Heartbeat commit verified in origin/main: $COMMIT_SHA"

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Streak Keeper check"
            echo ""
            echo "- Berlin date: ${{ steps.check.outputs.today || 'unknown' }}"
            echo "- Daily heartbeat needed: ${{ steps.check.outputs.needed || 'unknown' }}"
            echo "- New commit: ${{ steps.heartbeat.outputs.commit_sha || 'none (already covered today)' }}"
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "A successful push confirms the commit is on main; GitHub may take time to refresh the profile contribution graph."
          } >> "$GITHUB_STEP_SUMMARY"

  email-on-failure:
    name: Email alert if the keeper fails
    if: ${{ always() && needs.keeper.result == 'failure' }}
    needs: keeper
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send failure email through Gmail SMTP
        shell: python
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import os, smtplib, sys
          from email.message import EmailMessage

          username = os.environ.get("MAIL_USERNAME", "").strip()
          password = os.environ.get("MAIL_APP_PASSWORD", "").strip()
          recipient = os.environ.get("ALERT_EMAIL", "").strip()
          if not username or not password or not recipient:
              print("ERROR: Email not sent. Configure repository Actions secrets: MAIL_USERNAME, MAIL_APP_PASSWORD, ALERT_EMAIL.")
              sys.exit(1)

          msg = EmailMessage()
          msg["Subject"] = "[Streak Keeper] GitHub automation failed"
          msg["From"] = username
          msg["To"] = recipient
          msg.set_content(
              "The Streak Keeper workflow failed.\n\n"
              f"Repository: {os.environ['REPOSITORY']}\n"
              f"Run number: {os.environ['RUN_NUMBER']}\n"
              f"Trigger: {os.environ['EVENT_NAME']}\n"
              f"Run details: {os.environ['RUN_URL']}\n\n"
              "Open the run and inspect the failed step. The system cannot guarantee a contribution during GitHub outages or when Actions is disabled."
          )
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=20) as smtp:
              smtp.login(username, password)
              smtp.send_message(msg)
          print("Failure alert email sent.")
