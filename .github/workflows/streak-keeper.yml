name: Streak Keeper

on:
  schedule:
    # 07:00 Almanya saati (yaz UTC+2 = 05:00 UTC, kis UTC+1 = 06:00 UTC)
    - cron: '0 5,6 * * *'
    # 12:00 Almanya saati kontrolu (yaz 10:00 UTC, kis 11:00 UTC)
    - cron: '0 10,11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto | commit | check'
        required: false
        default: 'auto'

concurrency:
  group: streak-keeper
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_USER: Higer23
  TZ: Europe/Berlin
  GH_TOKEN: ${{ github.token }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git ayarlari
        run: |
          git config user.name "Higer23"
          git config user.email "208321685+Higer23@users.noreply.github.com"

      - name: Mod belirle (Almanya saati)
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          HOUR=$(date +%H)
          MODE="$INPUT_MODE"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            case "$HOUR" in
              07|08|09) MODE=commit ;;
              12|13|14) MODE=check ;;
              *) MODE=skip ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Berlin saati: $HOUR -> mod: $MODE"

      - name: Streak durumunu oku
        id: before
        if: steps.mode.outputs.mode != 'skip'
        run: |
          gh api graphql -f login="$GH_USER" -f query='query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}' > cal.json || echo '{}' > cal.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime
          try:
              d = json.load(open('cal.json'))
              weeks = d['data']['user']['contributionsCollection']['contributionCalendar']['weeks']
              m = {x['date']: x['contributionCount'] for w in weeks for x in w['contributionDays']}
              today = datetime.datetime.now(datetime.timezone.utc).date()
              t = m[str(today)]
              day = today if t > 0 else today - datetime.timedelta(days=1)
              s = 0
              while m.get(str(day), 0) > 0:
                  s += 1
                  day -= datetime.timedelta(days=1)
              print('known=true')
              print('today=%d' % t)
              print('streak=%d' % s)
          except Exception:
              print('known=false')
              print('today=0')
              print('streak=0')
          PY

      - name: Commit gerekli mi?
        id: need
        if: steps.mode.outputs.mode != 'skip'
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          NEED=false
          if [ "$MODE" = "commit" ]; then
            NEED=true
            # ayni gun zaten commit varsa tekrar atma (yaz/kis cift cron)
            if [ "${{ github.event_name }}" = "schedule" ] && git log --since="$(date -u +%Y-%m-%d)T00:00:00Z" --grep="chore(streak): daily update" --oneline | grep -q .; then
              NEED=false
            fi
          else
            # kontrol modu: bugun katki yoksa (veya okunamadiysa) tekrar commit at
            if [ "${{ steps.before.outputs.known }}" != "true" ] || [ "${{ steps.before.outputs.today }}" = "0" ]; then
              NEED=true
            fi
          fi
          echo "need=$NEED" >> "$GITHUB_OUTPUT"
          echo "Commit gerekli: $NEED"

      - name: Streak commit at
        id: commit
        if: steps.need.outputs.need == 'true'
        run: |
          push() {
            for i in 1 2 3; do
              git push origin HEAD:main && return 0
              git pull --rebase origin main
              sleep 5
            done
            return 1
          }
          RAND=$(head -c 200 /dev/urandom | tr -dc a-z0-9 | head -c 12)
          echo "<!-- streak-update: $RAND-$(date -u +%Y-%m-%dT%H:%M:%SZ) -->" >> README.md
          git add README.md
          git commit -m "chore(streak): daily update [skip ci]"
          push
          sed -i '$d' README.md
          git add README.md
          git commit -m "chore(streak): revert temp change [skip ci]"
          push
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Discord bildirimi
        if: always() && steps.mode.outputs.mode != 'skip' && env.DISCORD_WEBHOOK != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then ICON=":white_check_mark:"; else ICON=":x:"; fi
          if [ "${{ steps.before.outputs.known }}" = "true" ]; then
            INFO="bugun: ${{ steps.before.outputs.today }} katki, seri (commit oncesi): ${{ steps.before.outputs.streak }} gun"
          else
            INFO="streak durumu okunamadi"
          fi
          DID="${{ steps.commit.outputs.done }}"
          MSG="$ICON Streak Keeper [${{ steps.mode.outputs.mode }}] $(date +%H:%M) Berlin | $INFO | commit atildi: ${DID:-hayir} | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg c "$MSG" '{content:$c}' | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
