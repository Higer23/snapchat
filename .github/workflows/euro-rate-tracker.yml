name: Euro TRY Rate Tracker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: euro-rate-tracker-main
  cancel-in-progress: false

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch rate and update euro.txt
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 'https://api.frankfurter.dev/v1/latest?base=EUR&symbols=TRY')"
          export RESPONSE_JSON="$response"
          python3 - <<'PY'
          import os, re, json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          MAX_LINES = 10000
          TR_TZ = timezone(timedelta(hours=3))
          DAYS_TR = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar']
          HISTORY_HEADER = 'History (newest first):'
          RATE_RE = re.compile(r'1 EUR = ([0-9]+(?:\.[0-9]+)?) TRY')

          resp = json.loads(os.environ['RESPONSE_JSON'])
          rate = float(resp['rates']['TRY'])
          if rate <= 0:
              raise SystemExit('API returned an invalid EUR/TRY rate')
          rate_s = f'{rate:.4f}'
          rate_date = resp['date']

          now_utc = datetime.now(timezone.utc).replace(microsecond=0)
          now_tr = now_utc.astimezone(TR_TZ)
          stamp = f'{now_tr:%d.%m.%Y} {DAYS_TR[now_tr.weekday()]} {now_tr:%H:%M} TR | {now_utc:%H:%M} UTC'

          path = Path('euro.txt')
          old = path.read_text(encoding='utf-8') if path.exists() else ''
          old_history = old.split(HISTORY_HEADER, 1)[1] if HISTORY_HEADER in old else ''
          history = [line.rstrip() for line in old_history.splitlines() if line.strip().startswith('[')]

          def rate_of(line):
              m = RATE_RE.search(line)
              return float(m.group(1)) if m else None

          def is_change(line):
              return any(mark in line for mark in ('🟢', '🔴', '🆕'))

          def is_unchanged(line):
              return '🟡' in line and not is_change(line)

          prev = rate_of(history[0]) if history else None
          if prev is None:
              emoji, label = '🆕', 'İLK KAYIT'
          elif rate > prev:
              emoji, label = '🟢', 'ARTTI'
          elif rate < prev:
              emoji, label = '🔴', 'AZALDI'
          else:
              emoji, label = '🟡', 'DEĞİŞMEDİ'

          prev_part = f' | önceki {prev:.4f}' if prev is not None else ''
          entry = f'[{stamp}] {emoji} 1 EUR = {rate_s} TRY | {label}{prev_part} | kur tarihi {rate_date}'
          history.insert(0, entry)

          header = f'''EUR/TRY referans kuru
          Son güncelleme: {stamp}
          Güncel kur: 1 EUR = {rate_s} TRY
          Trend: {emoji} {label}
          Kur tarihi: {rate_date}
          Kaynak: Frankfurter API (referans kurlar)
          Kayıt sıklığı: 6 saatte bir (00:00, 06:00, 12:00, 18:00 UTC)
          Satır limiti: {MAX_LINES}. Aşılınca en eski 🟡 (değişmeyen) kayıt silinir. Fiyat değişimi kayıtları (🟢 🔴 🆕) asla silinmez.
          Lejant: 🟢 arttı | 🔴 azaldı | 🟡 değişmedi | 🆕 ilk kayıt

          {HISTORY_HEADER}
          '''

          def build(rows):
              return header + '\n'.join(rows) + '\n'

          text = build(history)
          deleted = 0
          while len(text.splitlines()) > MAX_LINES:
              idx = None
              for i in range(len(history) - 1, -1, -1):
                  if is_unchanged(history[i]):
                      idx = i
                      break
              if idx is None:
                  print('Limit exceeded but no unchanged rows left; price-change rows are kept.')
                  break
              del history[idx]
              deleted += 1
              text = build(history)

          path.write_text(text, encoding='utf-8')
          print(f'Recorded 1 EUR = {rate_s} TRY | {label} | total lines={len(text.splitlines())} deleted_unchanged={deleted}')
          PY

      - name: Commit and push with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Higer23'
          git config user.email '208321685+Higer23@users.noreply.github.com'
          git add euro.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'chore(euro): record EUR/TRY rate check'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done
          echo '::error::Could not push euro.txt after 5 attempts.'
          exit 1
