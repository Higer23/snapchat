name: Euro TRY Rate Tracker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: euro-rate-tracker-main
  cancel-in-progress: false

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch rate, preserve history newest-first
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 'https://api.frankfurter.dev/v1/latest?base=EUR&symbols=TRY')"
          export RESPONSE_JSON="$response"
          export CHECKED_AT="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          export CHECKED_ISO="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python3 - <<'PY'
          import os, json, re, datetime
          from pathlib import Path

          response = json.loads(os.environ["RESPONSE_JSON"])
          rate = float(response["rates"]["TRY"])
          if rate <= 0:
              raise SystemExit("API returned an invalid EUR/TRY rate")
          rate_s = f"{rate:.4f}"
          rate_date = response["date"]
          checked = os.environ["CHECKED_AT"]
          checked_iso = os.environ["CHECKED_ISO"]
          path = Path("euro.txt")
          old = path.read_text(encoding="utf-8") if path.exists() else ""

          # Current snapshot is before the history heading, so this finds the prior rate.
          current_section = old.split("History (newest first):", 1)[0]
          match = re.search(r"^1 EUR = ([0-9]+(?:\.[0-9]+)?) TRY\s*$", current_section, re.M)
          previous_rate = float(match.group(1)) if match else None

          if previous_rate is None:
              trend = "🟡 🆕 FIRST READING"
          elif rate > previous_rate:
              trend = "🟢 ⬆️ INCREASED"
          elif rate < previous_rate:
              trend = "🔴 ⬇️ DECREASED"
          else:
              trend = "🟡 ➖ UNCHANGED"

          history = []
          if "History (newest first):" in old:
              old_history = old.split("History (newest first):", 1)[1]
              history = [line.strip() for line in old_history.splitlines() if line.strip().startswith("[")]
          elif old:
              # Migrate the older single-snapshot format into the permanent history.
              old_rate = re.search(r"^1 EUR = ([0-9]+(?:\.[0-9]+)?) TRY\s*$", current_section, re.M)
              old_date = re.search(r"^Rate date:\s*(.+)$", current_section, re.M)
              old_checked = re.search(r"^Last checked:\s*(.+)$", current_section, re.M)
              old_trend = re.search(r"^Trend:\s*(.+)$", current_section, re.M)
              if old_rate:
                  stamp = old_checked.group(1) if old_checked else "legacy record"
                  history.append(f"[{stamp}] 1 EUR = {float(old_rate.group(1)):.4f} TRY | {old_trend.group(1) if old_trend else 'LEGACY RECORD'} | rate date {old_date.group(1) if old_date else 'unknown'}")

          entry = f"[{checked_iso}] 1 EUR = {rate_s} TRY | {trend} | rate date {rate_date}"
          # Add newest at the top, avoid duplicate entries caused by reruns within a second.
          history = [entry] + [item for item in history if item != entry]
          history = history[:1000]

          text = (
              "EUR/TRY reference rate\n"
              f"1 EUR = {rate_s} TRY\n"
              f"Trend: {trend}\n"
              f"Rate date: {rate_date}\n"
              f"Last checked: {checked}\n"
              "Source: Frankfurter API (reference rates)\n"
              f"Previous recorded rate: {f'{previous_rate:.4f} TRY' if previous_rate is not None else 'not available'}\n\n"
              "History (newest first):\n"
              + "\n".join(history) + "\n"
          )
          path.write_text(text, encoding="utf-8")
          print(f"Current EUR/TRY: {rate_s}; previous={previous_rate}; trend={trend}; history entries={len(history)}")
          PY

      - name: Commit and push with retry for concurrent workflow commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Higer23"
          git config user.email "208321685+Higer23@users.noreply.github.com"
          git add euro.txt
          git commit -m "chore(euro): record EUR/TRY rate check"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done
          echo "::error::Could not push euro.txt after 5 attempts."
          exit 1
