name: Euro TRY Rate Tracker

on:
  schedule:
    # GitHub Actions schedules are best-effort and may be delayed.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: euro-rate-tracker-main
  cancel-in-progress: false

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch rate and write euro.txt with trend
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 'https://api.frankfurter.dev/v1/latest?base=EUR&symbols=TRY')"
          new_rate="$(printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d["rates"]["TRY"]; assert isinstance(r,(int,float)) and r>0; print(f"{r:.4f}")')"
          rate_date="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["date"])')"
          previous_rate="$(python3 - <<'PY'
          import re
          try:
              text = open("euro.txt", encoding="utf-8").read()
              match = re.search(r"1 EUR = ([0-9]+(?:\.[0-9]+)?) TRY", text)
              print(match.group(1) if match else "")
          except FileNotFoundError:
              print("")
          PY
          )"
          trend="🟡 ➖ UNCHANGED"
          if [ -n "$previous_rate" ]; then
            trend="$(python3 - "$previous_rate" "$new_rate" <<'PY'
          import sys
          old, new = map(float, sys.argv[1:])
          if new > old:
              print("🟢 ⬆️ INCREASED")
          elif new < old:
              print("🔴 ⬇️ DECREASED")
          else:
              print("🟡 ➖ UNCHANGED")
          PY
          )"
          else
            trend="🟡 ➖ FIRST READING"
          fi
          updated_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          cat > euro.txt <<EOF
          EUR/TRY reference rate
          💶 1 EUR = ${new_rate} TRY
          Trend: ${trend}
          Rate date: ${rate_date}
          Last checked: ${updated_at}
          Source: Frankfurter API (reference rates)
          Previous recorded rate: ${previous_rate:-not available}
          EOF
          cat euro.txt

      - name: Commit every successful check
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Higer23"
          git config user.email "208321685+Higer23@users.noreply.github.com"
          git add euro.txt
          git commit -m "chore(euro): record EUR/TRY rate check"
          git push origin HEAD:main
